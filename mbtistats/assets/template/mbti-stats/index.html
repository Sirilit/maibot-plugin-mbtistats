                        <div class="trend-chart-box"><div class="trend-chart-title">四色人格历史趋势</div><div class="trend-chart-dom" id="trend-year-type4"></div></div>
                    </div>
                </div>
                <div class="trend-window-card" id="trend-window-all">
                    <div class="trend-window-title">全历史记录图</div>
                    <div class="trend-window-row">
