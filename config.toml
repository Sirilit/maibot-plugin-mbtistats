# MBTI Stats 插件配置

[plugin]
# 配置 schema 版本，请勿手动修改
config_version = "0.2.0"
# 总开关
enabled = true

[daily]
# 是否每天自动触发一次统计；触发后由 AI 决定是否调用工具并发送图表
enabled = false
# 每日触发时间
hour = 0
minute = 0
# 自动统计的群号
group_ids = [
    "639990875",
    "1075254868",
]

[render]
# 单次渲染超时（毫秒）
timeout_ms = 30000
# 渲染视口尺寸
viewport_width = 1050
viewport_height = 1000
# 其他群正在渲染时，本次工具调用最多等待多少秒
queue_wait_seconds = 20.0

[debug]
# 是否启用 /mbti-debug（或 /mbti_debug）确定性调试命令
enabled = true
